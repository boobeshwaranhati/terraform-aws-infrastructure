name: Terraform Plan

on:
  push:
    branches: [terraform-changes]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_application_bucket_name: ${{ vars.APPLICATION_BUCKET_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check

      - run: terraform init

      - run: terraform validate

      - name: Create plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan
          result=$?
          if [ $result -eq 1 ]; then exit 1; fi
          if [ $result -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; fi
        continue-on-error: true

      - name: Upload plan to S3
        if: github.event_name == 'push' && steps.plan.outputs.changes == 'true'
        run: aws s3 cp tfplan s3://terraform-state-plann/plans/${GITHUB_SHA}.tfplan
